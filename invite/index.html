<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Studio Direct — Rejoindre le direct</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; }
      body {
        font-family: Inter, system-ui, -apple-system, sans-serif;
        background: #0b0d12; color: #e8ecf4;
        min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px; padding: 20px;
      }
      h1 { font-size: 20px; font-weight: 600; }
      h1 small { color: #8b93a7; font-weight: 400; }
      video {
        width: min(92vw, 640px); aspect-ratio: 16/9; background: #05070b;
        border-radius: 12px; border: 1px solid #232a3a; object-fit: cover;
        transform: scaleX(-1); /* miroir : plus naturel pour se cadrer */
      }
      .status { color: #8b93a7; font-size: 14px; min-height: 20px; text-align: center; }
      .status.err { color: #ff7a7a; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
      button {
        font: inherit; color: #e8ecf4; background: #171c28;
        border: 1px solid #2a3245; border-radius: 9px; padding: 10px 18px; cursor: pointer;
      }
      button:hover { background: #1d2432; }
      button.primary { background: #2a56c6; border-color: #2a56c6; font-weight: 600; }
      button.primary:hover { background: #3363dd; }
      button.off { border-color: #b3483f; color: #ff9d94; }
      button:disabled { opacity: 0.5; cursor: default; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <h1>Studio Direct <small>— rejoindre le direct</small></h1>
    <video id="preview" autoplay playsinline muted></video>
    <div id="status" class="status">Vérification du lien…</div>
    <div class="row">
      <button id="join" class="primary hidden">Rejoindre avec caméra et micro</button>
      <button id="mute-mic" class="hidden">Couper le micro</button>
      <button id="mute-cam" class="hidden">Couper la caméra</button>
      <button id="hangup" class="hidden">Raccrocher</button>
    </div>
    <audio id="return-audio" autoplay></audio>

    <script src="peerjs.min.js"></script>
    <script>
      // Page invitee de Studio Direct : appelle l'hote via le broker public PeerJS
      // (signalisation seulement, le media est en pair-a-pair). Aucun secret ici :
      // le code de salle vient du lien d'invitation.
      const $ = (id) => document.getElementById(id);
      const statusEl = $('status');
      const setStatus = (t, err) => { statusEl.textContent = t; statusEl.classList.toggle('err', !!err); };

      const room = new URLSearchParams(location.search).get('room') || '';
      const ROOM_RE = /^[a-hj-km-np-z2-9]{8}$/; // meme alphabet que l'app
      let stream = null, peer = null, call = null;

      if (!ROOM_RE.test(room)) {
        setStatus("Lien d'invitation invalide — redemandez le lien à votre hôte.", true);
      } else {
        setStatus('Prêt. Autorisez la caméra et le micro pour rejoindre.');
        $('join').classList.remove('hidden');
      }

      $('join').onclick = async () => {
        $('join').disabled = true;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: { echoCancellation: true, noiseSuppression: true },
          });
        } catch (e) {
          setStatus('Caméra/micro refusés ou indisponibles : ' + e.message, true);
          $('join').disabled = false;
          return;
        }
        $('preview').srcObject = stream;
        connect();
      };

      function connect() {
        setStatus("Connexion à l'hôte…");
        peer = new Peer('studio-direct-' + room + '-guest');
        peer.on('open', () => {
          call = peer.call('studio-direct-' + room + '-host', stream);
          // Retour audio de l'hote (son micro) si l'hote en envoie un.
          call.on('stream', (remote) => { $('return-audio').srcObject = remote; });
          setStatus('Connecté — vous êtes dans le direct.');
          $('join').classList.add('hidden');
          $('mute-mic').classList.remove('hidden');
          $('mute-cam').classList.remove('hidden');
          $('hangup').classList.remove('hidden');
        });
        peer.on('error', (e) => {
          if (e.type === 'peer-unavailable') {
            setStatus("L'hôte n'est pas prêt. Demandez-lui de créer l'invitation, puis réessayez.", true);
          } else if (e.type === 'unavailable-id') {
            setStatus('Ce lien est déjà utilisé par un autre invité.', true);
          } else {
            setStatus('Échec de la connexion (' + e.type + '). Vérifiez votre réseau et réessayez.', true);
          }
          teardown(false);
          $('join').classList.remove('hidden');
          $('join').disabled = false;
          $('join').textContent = 'Réessayer';
        });
      }

      function toggleTrack(kind, btn, labelOn, labelOff) {
        const t = stream && stream['get' + kind + 'Tracks']()[0];
        if (!t) return;
        t.enabled = !t.enabled;
        btn.textContent = t.enabled ? labelOn : labelOff;
        btn.classList.toggle('off', !t.enabled);
      }
      $('mute-mic').onclick = () => toggleTrack('Audio', $('mute-mic'), 'Couper le micro', 'Micro coupé');
      $('mute-cam').onclick = () => toggleTrack('Video', $('mute-cam'), 'Couper la caméra', 'Caméra coupée');

      function teardown(stopMedia) {
        if (call) { try { call.close(); } catch (_) {} call = null; }
        if (peer) { try { peer.destroy(); } catch (_) {} peer = null; }
        if (stopMedia && stream) {
          stream.getTracks().forEach((t) => t.stop());
          stream = null;
          $('preview').srcObject = null;
        }
      }

      $('hangup').onclick = () => {
        teardown(true);
        setStatus('Vous avez quitté le direct. Vous pouvez fermer cette page.');
        $('mute-mic').classList.add('hidden');
        $('mute-cam').classList.add('hidden');
        $('hangup').classList.add('hidden');
      };
    </script>
  </body>
</html>
